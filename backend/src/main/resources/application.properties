spring.application.name=exam-lecture-timetable
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timetable_sprint1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Excluded dates from the December 2026 exam seed. Add dates for future periods as needed.
timetable.exam.holiday-dates=2026-12-23,2026-12-25


# AI scheduling service (ai-service/). Override with the AI_SERVICE_URL environment variable.
timetable.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

